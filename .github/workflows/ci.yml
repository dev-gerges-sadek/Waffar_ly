name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test
      # Fail the build if a secret-looking literal is committed.
      - name: Secret scan
        run: |
          if grep -rEn "gsk_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{35}.*(groq|weather)|sk-[A-Za-z0-9]{20,}" lib; then
            echo "Hard-coded secret detected"; exit 1
          fi
