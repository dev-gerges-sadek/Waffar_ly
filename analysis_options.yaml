include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - "**/*.g.dart"
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # deprecated_member_use is no longer ignored: deprecated APIs must be
    # migrated (or silenced locally with a justification).
    unawaited_futures: warning

linter:
  rules:
    - avoid_print
    - unawaited_futures
    - use_build_context_synchronously
    - cancel_subscriptions
    - close_sinks
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - avoid_dynamic_calls
    - always_declare_return_types
